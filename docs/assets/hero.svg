<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <title>TouchClip — Your clipboard, within reach.</title>
  <desc>An ivory panel, green clipboard mark, and an illustration of saved text entries on a Touch Bar. Controls appear while TouchClip is active.</desc>
  <rect width="1280" height="640" rx="24" fill="#F3F2EC"/>
  <path d="M72 124H1208" stroke="#D5D8CE"/>
  <rect x="72" y="56" width="44" height="44" rx="12" fill="#214B3B"/>
  <path d="M86 69H83V89H104V69H101M89 66H98V73H89V66ZM88 79H99M88 84H96" stroke="#F3F2EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="132" y="88" fill="#1F3028" font-size="29" font-weight="650" letter-spacing="-1">TouchClip</text>
    <text x="1208" y="84" text-anchor="end" fill="#626F65" font-size="14" letter-spacing="2">A LITTLE MAC UTILITY</text>
    <text x="68" y="222" fill="#1F3028" font-size="76" font-weight="650" letter-spacing="-3.5">Your clipboard,</text>
    <text x="68" y="305" fill="#214B3B" font-size="76" font-weight="650" letter-spacing="-3.5">within reach.</text>
    <text x="1208" y="233" text-anchor="end" fill="#626F65" font-size="18">Recent text.</text>
    <text x="1208" y="261" text-anchor="end" fill="#626F65" font-size="18">One tap away.</text>
    <rect x="72" y="365" width="1136" height="116" rx="28" fill="#D7DAD2"/>
    <rect x="78" y="371" width="1124" height="104" rx="23" fill="#171C19"/>
    <rect x="98" y="394" width="57" height="58" rx="11" fill="#303A34"/>
    <path d="M131 412L120 423L131 434" stroke="#A0ADA4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="165" y="394" width="274" height="58" rx="11" fill="#C9DEC7"/>
    <text x="192" y="431" fill="#1F3028" font-size="23" font-weight="500">A short note</text>
    <rect x="449" y="394" width="274" height="58" rx="11" fill="#303A34"/>
    <text x="476" y="431" fill="#F1F4EE" font-size="23">An email draft</text>
    <rect x="733" y="394" width="274" height="58" rx="11" fill="#303A34"/>
    <text x="760" y="431" fill="#F1F4EE" font-size="23">One useful sentence</text>
    <rect x="1017" y="394" width="57" height="58" rx="11" fill="#303A34"/>
    <path d="M1040 412L1051 423L1040 434" stroke="#E2EAE0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1094 399V447" stroke="#4B554E"/>
    <rect x="1112" y="404" width="66" height="38" rx="9" fill="#303A34"/>
    <path d="M1140 417L1146 423L1140 429" stroke="#A0ADA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="525" fill="#1F3028" font-size="18" font-weight="500">Open TouchClip → tap an entry → ⌘V</text>
    <text x="1208" y="525" text-anchor="end" fill="#626F65" font-size="14">App controls appear while TouchClip is active.</text>
    <path d="M72 557H1208" stroke="#D5D8CE"/>
    <text x="72" y="597" fill="#626F65" font-size="14" letter-spacing="1">20 ENTRIES · MEMORY ONLY · NO CLOUD</text>
    <text x="1208" y="597" text-anchor="end" fill="#626F65" font-size="14" letter-spacing="1">SWIFT + APPKIT / macOS 14+</text>
  </g>
</svg>
